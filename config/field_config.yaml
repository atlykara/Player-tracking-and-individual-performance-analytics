# Pitch model and named landmarks used for calibration.
# Every pitch measurement in the project comes from this file; no Python
# module hard-codes a pitch dimension or a landmark position.

pitch:
  # Pitch size as given in the dataset metadata of match 118575
  # (118575_tracker_box_metadata.xml: <pitch width="105" height="68"/>);
  # this is also the FIFA standard size.
  #
  # Axis convention (fixed), all values in metres:
  #   x: along the pitch length, 0 = left goal line, 105 = right goal line
  #   y: across the pitch,       0 = far touchline,  68 = near touchline
  #                                                       (camera side)
  # Origin (0, 0) = left far corner. "left / right" and "far / near" are as
  # seen from the camera, so x grows to the right and y grows towards the
  # camera, the same directions as the pixel axes of the video.
  length_m: 105
  width_m: 68

# Named reference points: where a marked line meets or crosses another one.
# Naming: <object>_<side>, with
#   far / near    side of the far / near touchline
#   left / right  half of the left / right goal
#   _goal         the point lies on the goal line
#   _in           the point lies on the inner line of the box (inside the pitch)
# Any landmark may be skipped during selection (not visible, hidden by a
# player, unclear in the image); it then has no row in the points file.
landmarks:
  # Pitch outline and halfway line
  corner_left_far:          {x_m: 0.0,   y_m: 0.0}
  corner_left_near:         {x_m: 0.0,   y_m: 68.0}
  corner_right_far:         {x_m: 105.0, y_m: 0.0}
  corner_right_near:        {x_m: 105.0, y_m: 68.0}
  halfway_far:              {x_m: 52.5,  y_m: 0.0}
  halfway_near:             {x_m: 52.5,  y_m: 68.0}

  # Centre spot and centre circle (radius 9.15 m)
  centre_spot:              {x_m: 52.5,  y_m: 34.0}
  centre_circle_far:        {x_m: 52.5,  y_m: 24.85}
  centre_circle_near:       {x_m: 52.5,  y_m: 43.15}
  centre_circle_left:       {x_m: 43.35, y_m: 34.0}
  centre_circle_right:      {x_m: 61.65, y_m: 34.0}

  # Left penalty area (16.5 m deep, 40.32 m wide)
  left_pen_far_goal:        {x_m: 0.0,   y_m: 13.84}
  left_pen_near_goal:       {x_m: 0.0,   y_m: 54.16}
  left_pen_far_in:          {x_m: 16.5,  y_m: 13.84}
  left_pen_near_in:         {x_m: 16.5,  y_m: 54.16}

  # Left goal area (5.5 m deep, 18.32 m wide)
  left_goalarea_far_goal:   {x_m: 0.0,   y_m: 24.84}
  left_goalarea_near_goal:  {x_m: 0.0,   y_m: 43.16}
  left_goalarea_far_in:     {x_m: 5.5,   y_m: 24.84}
  left_goalarea_near_in:    {x_m: 5.5,   y_m: 43.16}

  # Left goal posts (goal 7.32 m wide) - optional
  left_post_far:            {x_m: 0.0,   y_m: 30.34}
  left_post_near:           {x_m: 0.0,   y_m: 37.66}

  # Right penalty area (mirror of the left side: x -> 105 - x)
  right_pen_far_goal:       {x_m: 105.0, y_m: 13.84}
  right_pen_near_goal:      {x_m: 105.0, y_m: 54.16}
  right_pen_far_in:         {x_m: 88.5,  y_m: 13.84}
  right_pen_near_in:        {x_m: 88.5,  y_m: 54.16}

  # Right goal area
  right_goalarea_far_goal:  {x_m: 105.0, y_m: 24.84}
  right_goalarea_near_goal: {x_m: 105.0, y_m: 43.16}
  right_goalarea_far_in:    {x_m: 99.5,  y_m: 24.84}
  right_goalarea_near_in:   {x_m: 99.5,  y_m: 43.16}

  # Right goal posts - optional
  right_post_far:           {x_m: 105.0, y_m: 30.34}
  right_post_near:          {x_m: 105.0, y_m: 37.66}

  # Touchline points every 5.5 m (x_m = 5.5 ... 49.5 from the left goal line,
  # 55.5 ... 99.5 = the same distances from the right goal line). No pitch
  # line crosses the touchline there: the dataset marks them where the edges
  # of the mowing stripes meet the touchline. Their pixel positions are NOT
  # clicked; they are taken from the dataset keypoint file
  # (118575_keypoints.json). They were added because the 31 clicked
  # landmarks give only three points on each touchline.
  # Far touchline
  touchline_far_5.5m:       {x_m: 5.5,   y_m: 0.0}
  touchline_far_11m:        {x_m: 11.0,  y_m: 0.0}
  touchline_far_16.5m:      {x_m: 16.5,  y_m: 0.0}
  touchline_far_22m:        {x_m: 22.0,  y_m: 0.0}
  touchline_far_27.5m:      {x_m: 27.5,  y_m: 0.0}
  touchline_far_33m:        {x_m: 33.0,  y_m: 0.0}
  touchline_far_38.5m:      {x_m: 38.5,  y_m: 0.0}
  touchline_far_44m:        {x_m: 44.0,  y_m: 0.0}
  touchline_far_49.5m:      {x_m: 49.5,  y_m: 0.0}
  touchline_far_55.5m:      {x_m: 55.5,  y_m: 0.0}
  touchline_far_61m:        {x_m: 61.0,  y_m: 0.0}
  touchline_far_66.5m:      {x_m: 66.5,  y_m: 0.0}
  touchline_far_72m:        {x_m: 72.0,  y_m: 0.0}
  touchline_far_77.5m:      {x_m: 77.5,  y_m: 0.0}
  touchline_far_83m:        {x_m: 83.0,  y_m: 0.0}
  touchline_far_88.5m:      {x_m: 88.5,  y_m: 0.0}
  touchline_far_94m:        {x_m: 94.0,  y_m: 0.0}
  touchline_far_99.5m:      {x_m: 99.5,  y_m: 0.0}

  # Near touchline
  touchline_near_5.5m:      {x_m: 5.5,   y_m: 68.0}
  touchline_near_11m:       {x_m: 11.0,  y_m: 68.0}
  touchline_near_16.5m:     {x_m: 16.5,  y_m: 68.0}
  touchline_near_22m:       {x_m: 22.0,  y_m: 68.0}
  touchline_near_27.5m:     {x_m: 27.5,  y_m: 68.0}
  touchline_near_33m:       {x_m: 33.0,  y_m: 68.0}
  touchline_near_38.5m:     {x_m: 38.5,  y_m: 68.0}
  touchline_near_44m:       {x_m: 44.0,  y_m: 68.0}
  touchline_near_49.5m:     {x_m: 49.5,  y_m: 68.0}
  touchline_near_55.5m:     {x_m: 55.5,  y_m: 68.0}
  touchline_near_61m:       {x_m: 61.0,  y_m: 68.0}
  touchline_near_66.5m:     {x_m: 66.5,  y_m: 68.0}
  touchline_near_72m:       {x_m: 72.0,  y_m: 68.0}
  touchline_near_77.5m:     {x_m: 77.5,  y_m: 68.0}
  touchline_near_83m:       {x_m: 83.0,  y_m: 68.0}
  touchline_near_88.5m:     {x_m: 88.5,  y_m: 68.0}
  touchline_near_94m:       {x_m: 94.0,  y_m: 68.0}
  touchline_near_99.5m:     {x_m: 99.5,  y_m: 68.0}

# Pixel positions of the landmarks, written by "python src/calibrate.py select":
#   name, x_m, y_m, px_x, px_y, source, use
#   source  own = selected by hand on the video frame, dataset = touchline
#           mark whose pixel position comes from the dataset
#   use     1 = reference point of the calibration, 0 = kept in the file
#           but not used. All 67 points are in use. "fit" reports how far
#           each dataset mark is from the prediction of the own points.
points_file: config/calibration_points.csv

# Pixel -> metre mapping ("python src/calibrate.py fit"). The calibration is
# built from the reference points (use = 1 in the points file).
calibration:
  # reference_points: each position is mapped with a homography fitted to all
  #   reference points, where the points near that position count more. The
  #   mapping passes through the reference points themselves, so the pitch
  #   lines in the grid image run through them.
  # pieces: the pitch is cut into equal pieces along x, one homography per
  #   piece, neighbouring pieces blended. Only the baseline for comparison.
  method: reference_points
  radius_m: 30          # reference points within this distance count most
  min_weight: 0.05      # smallest weight a far reference point keeps
  pixel_space: undistorted   # lens model: config/118575_camera_intrinsics.npz
  # Method "pieces" only: number of equal pieces along x, and how far a piece
  # reaches into its neighbours when its homography is fitted.
  pieces: 3
  overlap_m: 10
